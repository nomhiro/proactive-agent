[project]
name = "vehicle-core"
version = "0.1.0"
description = "架空の車種開発データと、プロアクティブエージェントの判定ロジック（Azure も LLM も使わない部分）"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "tzdata"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
