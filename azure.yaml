# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: proactive-agent
metadata:
  template: proactive-agent
services:
  functions:
    project: ./functions
    language: python
    host: function
    hooks:
      prepackage:
        run: uv run python ../scripts/package_functions.py prepare
      postpackage:
        run: uv run python ../scripts/package_functions.py cleanup
  # Web アプリ（BFF と画面）。ビルドの文脈はリポジトリの直下、イメージは ACR でビルドする
  web:
    project: ./web
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ..
      remoteBuild: true
hooks:
  postprovision:
    run: uv run --package proactive-functions python scripts/seed.py
  # MCP 接続、エージェント4体、スキル、ロール、対応表、Memory ストア、Routines、RAI ポリシー（設計書 7.10 節）
  postdeploy:
    run: uv run --package proactive-deploy python -m proactive_deploy.setup
